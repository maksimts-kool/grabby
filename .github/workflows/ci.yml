name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Theme matches design/tokens.json
        run: bun run theme:check
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test --ci

  android:
    name: Native module compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
      - run: bunx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: Compile the Kotlin module
        working-directory: android
        run: ./gradlew :grabby-native:compileDebugKotlin --console=plain
