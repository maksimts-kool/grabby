# The four tabs open and show their empty states on a fresh install (after onboarding).
appId: dev.grabby.app
---
- launchApp
- tapOn:
    id: 'tab-downloads'
- assertVisible: 'Nothing downloading'
- tapOn:
    id: 'tab-activity'
- assertVisible: 'Activity'
- tapOn:
    id: 'tab-settings'
- assertVisible: 'Check for updates'
- assertVisible: 'Only on Wi‑Fi'
- tapOn:
    id: 'tab-index'
- assertVisible: 'My apps'
